[project]
name = "adappmailles"
version = "0.1.0"
description = "Application pour générer des couvertures et échantillons de tricot"
requires-python = ">=3.11"

dependencies = [
    "pillow>=12.2.0",
    "pytest>=9.0.3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/adappmailles/tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
